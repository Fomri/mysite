<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
    <!-- iOS Web App / Add to Home Screen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Smoky" />
  <meta name="theme-color" content="#09090b" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="" />
  <link id="favicon" rel="icon" type="image/png" href="" />

  
  <title>Smoky</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            ios: {
              bg: '#09090b',
              card: '#141417',
              elevated: '#1e1e24',
              border: '#27272f',
              accent: '#f59e0b',
              accentSoft: 'rgba(245, 158, 11, 0.14)',
              emerald: '#10b981',
              rose: '#f43f5e',
              sky: '#38bdf8'
            }
          }
        }
      }
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: text;
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(5.25rem + env(safe-area-inset-bottom));
    }
    .bottom-nav-safe {
      padding-bottom: calc(0.65rem + env(safe-area-inset-bottom));
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.5; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* iOS Safari gives native time inputs a large intrinsic minimum width.
       Constrain them inside the modal so their rounded border never clips. */
    .modal-time-input {
      display: block;
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100%;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
    }
    #modal-box {
      box-sizing: border-box;
      min-width: 0;
      overflow-x: hidden;
      width: 100%;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-amber-500/30">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-ios-bg/85 backdrop-blur-xl border-b border-ios-border/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
        <svg class="w-4 h-4 text-zinc-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-none">Smoky</h1>
        <p id="header-subtitle" class="text-[11px] text-zinc-400 mt-0.5 font-medium">Quota & Schedule</p>
      </div>
    </div>
    <button id="data-tools-button" onclick="openDataToolsModal()" class="hidden w-10 h-10 rounded-xl bg-ios-elevated border border-ios-border text-zinc-200 items-center justify-center active:scale-95 transition" aria-label="Export or import data" title="Export / Import">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 17v4h14v-4"/>
      </svg>
    </button>
  </header>


  <!-- Main Content Area -->
  <main id="app-content" class="max-w-lg mx-auto px-4 pt-4">
    <!-- Views injected dynamically -->
  </main>

  <!-- Bottom Tab Navigation (iOS Style) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-ios-card/90 backdrop-blur-xl border-t border-ios-border bottom-nav-safe pt-2 px-6">
    <div class="max-w-lg mx-auto grid grid-cols-3 gap-2">
      <button onclick="switchTab('today')" id="nav-today" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl transition active:scale-95">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/>
        </svg>
        <span class="text-[11px] font-semibold">Today</span>
      </button>

      <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl transition active:scale-95">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="text-[11px] font-semibold">Schedule</span>
      </button>

      <button onclick="switchTab('stats')" id="nav-stats" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl transition active:scale-95">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span class="text-[11px] font-semibold">Stats</span>
      </button>
    </div>
  </nav>

  <!-- Modal Backdrop & Container -->
  <div id="modal-overlay" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4" onclick="handleBackdropClick(event)">
    <div id="modal-box" class="w-full max-w-lg bg-ios-card border-t sm:border border-ios-border rounded-t-3xl sm:rounded-3xl p-5 pb-8 sm:pb-6 shadow-2xl animate-sheet max-h-[88vh] overflow-y-auto">
      <!-- Modal content injected here -->
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200 transform -translate-y-2">
    <div id="toast-inner" class="bg-zinc-800/95 backdrop-blur-md text-white text-xs font-semibold px-4 py-2.5 rounded-full border border-zinc-700 shadow-xl flex items-center gap-2 whitespace-nowrap">
    </div>
  </div>

  <script>
    /*************************************************************************
     * 1. GENERATE CRISP APPLE TOUCH ICON VIA CANVAS (FOR ADD TO HOME SCREEN)
     *************************************************************************/
    (function generateAppIcon() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Background gradient
        const grad = ctx.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#18181b');
        grad.addColorStop(1, '#09090b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);

        // Outer amber ring
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 34;
        ctx.beginPath();
        ctx.arc(256, 256, 165, 0, Math.PI * 2);
        ctx.stroke();

        // Inner subtle track
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.22)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(256, 256, 120, 0, Math.PI * 2);
        ctx.stroke();

        // Clock hands
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 24;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(256, 256);
        ctx.lineTo(256, 156);
        ctx.moveTo(256, 256);
        ctx.lineTo(326, 290);
        ctx.stroke();

        // Center dot
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(256, 256, 18, 0, Math.PI * 2);
        ctx.fill();

        const dataUrl = canvas.toDataURL('image/png');
        document.getElementById('apple-touch-icon').href = dataUrl;
        document.getElementById('favicon').href = dataUrl;
      } catch (e) {
        console.warn('Icon generation skipped', e);
      }
    })();

    /*************************************************************************
     * 2. STATE & LOCALSTORAGE PERSISTENCE
     *************************************************************************/
    const STORAGE_KEY = 'Smoky_v1_data';
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const SHORT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
    }

    // The app's day runs from 04:00 local time until 03:59:59 the next day.
    function getLogicalNow() {
      const d = new Date();
      if (d.getHours() < 4) d.setDate(d.getDate() - 1);
      return d;
    }

    function getTodayKey(offsetDays = 0) {
      const d = getLogicalNow();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getDateKeyFromOffset(dateKey, offsetDays) {
      const [y, m, d] = dateKey.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + offsetDays);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function formatDisplayDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      return dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function timeToMinutes(time) {
      const [h, m] = time.split(':').map(Number);
      return h * 60 + m;
    }

    function getCurrentTimeStr() {
      const now = new Date();
      return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function createSampleSchedule() {
      const weekdaySlots = () => [
        { id: uid(), time: '08:30', label: 'Morning Coffee', count: 1 },
        { id: uid(), time: '10:30', label: 'Break 1', count: 1 },
        { id: uid(), time: '13:15', label: 'Lunch Break', count: 1 },
        { id: uid(), time: '16:30', label: 'Afternoon Wrap-up', count: 1 },
        { id: uid(), time: '20:30', label: 'Evening Social', count: 1 }
      ];
      const weekendSlots = () => [
        { id: uid(), time: '10:00', label: 'Late Morning', count: 1 },
        { id: uid(), time: '14:00', label: 'Afternoon Chill', count: 1 },
        { id: uid(), time: '18:30', label: 'Pre-Dinner', count: 1 },
        { id: uid(), time: '22:00', label: 'Night Out / Social', count: 2 }
      ];
      return {
        0: weekdaySlots(), // Sunday
        1: weekdaySlots(), // Monday
        2: weekdaySlots(), // Tuesday
        3: weekdaySlots(), // Wednesday
        4: weekdaySlots(), // Thursday
        5: weekendSlots(), // Friday
        6: weekendSlots()  // Saturday
      };
    }

    let state = {
      activeTab: 'today',
      selectedScheduleDay: getLogicalNow().getDay(),
      schedule: {},
      scheduleOverrides: {}, // one-time schedules keyed by logical YYYY-MM-DD
      scheduleMode: 'recurring',
      logs: {}, // keyed by logical YYYY-MM-DD
      startedAt: null
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.schedule = parsed.schedule || createSampleSchedule();
          state.scheduleOverrides = parsed.scheduleOverrides || {};
          state.logs = parsed.logs || {};
          state.startedAt = parsed.startedAt || Object.keys(state.logs).sort()[0] || null;
        } else {
          state.schedule = createSampleSchedule();
          saveState();
        }
      } catch (e) {
        console.error('Error loading state:', e);
        state.schedule = createSampleSchedule();
      }
      if (!state.startedAt) state.startedAt = getTodayKey();
      ensureTodayLog();
      saveState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          schedule: state.schedule,
          scheduleOverrides: state.scheduleOverrides,
          logs: state.logs,
          startedAt: state.startedAt,
          schemaVersion: 3
        }));
      } catch (e) {
        console.error('Error saving state:', e);
      }
    }

    function getNextDateForWeekday(dayIdx) {
      const today = getLogicalNow();
      const delta = ((dayIdx - today.getDay() + 7) % 7) || 7;
      const target = new Date(today.getFullYear(), today.getMonth(), today.getDate() + delta);
      return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
    }

    function getScheduleTargetDate(dayIdx = state.selectedScheduleDay) {
      return state.scheduleMode === 'next' ? getNextDateForWeekday(dayIdx) : null;
    }

    function getScheduleSlotsForDay(dayIdx, dateKey = getScheduleTargetDate(dayIdx)) {
      if (dateKey && state.scheduleOverrides && Array.isArray(state.scheduleOverrides[dateKey])) return state.scheduleOverrides[dateKey];
      return state.schedule[dayIdx] || [];
    }

    function setScheduleSlotsForSelectedDay(slots) {
      const dateKey = getScheduleTargetDate();
      if (dateKey) state.scheduleOverrides[dateKey] = slots;
      else state.schedule[state.selectedScheduleDay] = slots;
    }

    /**
     * Ensures today's log exists and syncs with today's weekly schedule template
     * while preserving already completed or sacrificed slot actions.
     */
    function ensureTodayLog() {
      const todayKey = getTodayKey();
      const dayOfWeek = getLogicalNow().getDay();
      const templateSlots = getScheduleSlotsForDay(dayOfWeek, todayKey).slice().sort((a, b) => (a.time < '04:00' ? 1440 : 0) + timeToMinutes(a.time) - ((b.time < '04:00' ? 1440 : 0) + timeToMinutes(b.time)));

      if (!state.logs[todayKey]) {
        state.logs[todayKey] = {
          date: todayKey,
          dayOfWeek,
          slots: templateSlots.map(s => ({
            slotId: s.id,
            time: s.time,
            label: s.label,
            allowance: s.count || 1,
            smokedCount: 0,
            sacrificedCount: 0,
            skippedCount: 0,
            events: [] // { type: 'scheduled'|'sacrificed'|'skipped', timestamp, note }
          })),
          extraLogs: [] // { id, type: 'swapped'|'unexpected', timestamp, reason, sacrificedSlotId, sacrificedSlotLabel }
        };
        saveState();
      } else {
        // Sync any newly added/edited template slots without wiping progress
        const log = state.logs[todayKey];
        const existingMap = new Map(log.slots.map(s => [s.slotId, s]));
        const syncedSlots = templateSlots.map(t => {
          if (existingMap.has(t.id)) {
            const existing = existingMap.get(t.id);
            existing.time = t.time;
            existing.label = t.label;
            existing.skippedCount = existing.skippedCount || 0;
            existing.allowance = Math.max(t.count || 1, existing.smokedCount + existing.sacrificedCount + existing.skippedCount);
            return existing;
          }
          return {
            slotId: t.id,
            time: t.time,
            label: t.label,
            allowance: t.count || 1,
            smokedCount: 0,
            sacrificedCount: 0,
            skippedCount: 0,
            events: []
          };
        });
        log.slots = syncedSlots;
        saveState();
      }
    }

    function getDayMetrics(log) {
      if (!log) return { planned: 0, smoked: 0, sacrificed: 0, skipped: 0, unexpected: 0, swapped: 0 };
      let planned = 0;
      let scheduledSmoked = 0;
      let sacrificed = 0;
      let skipped = 0;

      log.slots.forEach(s => {
        planned += s.allowance;
        scheduledSmoked += s.smokedCount;
        sacrificed += s.sacrificedCount;
        skipped += (s.skippedCount || 0);
      });

      let swapped = 0;
      let unexpected = 0;
      (log.extraLogs || []).forEach(e => {
        if (e.type === 'swapped') swapped += 1;
        if (e.type === 'unexpected') unexpected += 1;
      });

      const totalSmoked = scheduledSmoked + swapped + unexpected;
      return { planned, totalSmoked, scheduledSmoked, sacrificed, skipped, swapped, unexpected };
    }

    /**
     * Smoke-time helpers (used by the "since last cigarette" stopwatch and the average gap in Stats).
     * New events carry a precise `ts` (ms); older ones only have "HH:MM", so we rebuild a time from the day key.
     */
    function eventTs(dateKey, ev) {
      if (ev.ts) return ev.ts;
      if (!ev.timestamp) return null;
      const [y, m, d] = dateKey.split('-').map(Number);
      const [hh, mm] = ev.timestamp.split(':').map(Number);
      if (isNaN(hh) || isNaN(mm)) return null;
      // A logical day starts at 04:00: legacy HH:MM events before 04:00
      // happened on the following calendar date.
      const eventDate = new Date(y, m - 1, d);
      if (hh < 4) eventDate.setDate(eventDate.getDate() + 1);
      eventDate.setHours(hh, mm, 0, 0);
      return eventDate.getTime();
    }

    // Sorted list of the times (ms) a cigarette was actually smoked on a given day
    function getSmokeTimes(log, dateKey) {
      if (!log) return [];
      const times = [];
      (log.slots || []).forEach(s => (s.events || []).forEach(e => {
        if (e.type === 'scheduled') {
          const t = eventTs(dateKey, e);
          if (t) times.push(t);
        }
      }));
      (log.extraLogs || []).forEach(e => {
        if (e.type === 'swapped' || e.type === 'unexpected') {
          const t = eventTs(dateKey, e);
          if (t) times.push(t);
        }
      });
      return times.sort((a, b) => a - b);
    }

    // Most recent smoked cigarette across all days (null if none logged)
    function getLastSmokeTs() {
      const keys = Object.keys(state.logs).sort((a, b) => b.localeCompare(a));
      for (const k of keys) {
        const t = getSmokeTimes(state.logs[k], k);
        if (t.length) return t[t.length - 1];
      }
      return null;
    }

    // Average gap (ms) between consecutive cigarettes in a day; null if fewer than 2
    function getAvgGapMs(times) {
      if (times.length < 2) return null;
      return (times[times.length - 1] - times[0]) / (times.length - 1);
    }

    function formatGap(ms) {
      const totalMin = Math.round(ms / 60000);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    function formatStopwatch(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const sec = total % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function tickStopwatch() {
      const el = document.getElementById('since-last');
      if (!el) return;
      const ts = Number(el.dataset.ts);
      if (!ts) return;
      el.textContent = formatStopwatch(Date.now() - ts);
    }

    /*************************************************************************
     * 3. UI HELPERS (TOAST & MODALS)
     *************************************************************************/
    let toastTimer = null;
    function showToast(message, icon = '✓') {
      const toast = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      inner.innerHTML = `<span class="text-amber-400 font-bold">${icon}</span><span>${message}</span>`;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2400);
    }

    function openModal(htmlContent) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      box.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    }

    /*************************************************************************
     * 4. NAVIGATION & RENDER ROUTER
     *************************************************************************/
    function switchTab(tab) {
      state.activeTab = tab;
      render();
    }

    function render() {
      // Update bottom nav active styles
      ['today', 'schedule', 'stats'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === state.activeTab) {
          btn.classList.add('text-amber-400', 'bg-amber-500/10');
          btn.classList.remove('text-zinc-500');
        } else {
          btn.classList.remove('text-amber-400', 'bg-amber-500/10');
          btn.classList.add('text-zinc-500');
        }
      });

      const container = document.getElementById('app-content');
      const dataTools = document.getElementById('data-tools-button');
      dataTools.classList.toggle('hidden', state.activeTab !== 'stats');
      dataTools.classList.toggle('flex', state.activeTab === 'stats');
      if (state.activeTab === 'today') {
        document.getElementById('header-subtitle').textContent = formatDisplayDate(getTodayKey());
        container.innerHTML = renderTodayView();
      } else if (state.activeTab === 'schedule') {
        document.getElementById('header-subtitle').textContent = 'Weekly Rules & Slots';
        container.innerHTML = renderScheduleView();
      } else if (state.activeTab === 'stats') {
        document.getElementById('header-subtitle').textContent = '7-Day Discipline & Logs';
        container.innerHTML = renderStatsView();
      }
    }

    /*************************************************************************
     * 5. TODAY VIEW & ACTIONS (CORE LOGIC)
     *************************************************************************/
    function renderTodayView() {
      ensureTodayLog();
      const todayKey = getTodayKey();
      const log = state.logs[todayKey];
      const m = getDayMetrics(log);

      const effectiveLimit = m.planned + m.unexpected;
      const radius = 52;
      const circumference = 2 * Math.PI * radius;
      // Smoked fills the ring from the top (amber); skipped cigarettes fill the next part in green
      const smokedFrac = effectiveLimit > 0 ? Math.min(1, m.totalSmoked / effectiveLimit) : 0;
      const skippedFrac = effectiveLimit > 0 ? Math.max(0, Math.min(1 - smokedFrac, m.skipped / effectiveLimit)) : 0;
      const smokedLen = smokedFrac * circumference;
      const skippedLen = skippedFrac * circumference;

      const ringColor = m.totalSmoked > effectiveLimit ? '#f43f5e' : '#f59e0b';

      const nowTime = getCurrentTimeStr();

      const lastTs = getLastSmokeTs();
      let lastLabel = '';
      if (lastTs) {
        const ld = new Date(lastTs);
        const lastClock = ld.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        const sameDay = ld.toDateString() === new Date().toDateString();
        lastLabel = sameDay ? lastClock : `${ld.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} ${lastClock}`;
      }

      // Build Slots List HTML
      let slotsHtml = '';
      if (log.slots.length === 0) {
        slotsHtml = `
          <div class="bg-ios-card border border-ios-border rounded-2xl p-6 text-center">
            <p class="text-sm text-zinc-400 mb-3">No smoking slots scheduled for ${DAYS[log.dayOfWeek]}.</p>
            <button onclick="switchTab('schedule')" class="px-4 py-2 rounded-xl bg-amber-500 text-zinc-950 font-semibold text-xs active:scale-95 transition">
              Configure ${DAYS[log.dayOfWeek]} Schedule
            </button>
          </div>
        `;
      } else {
        slotsHtml = log.slots.map(slot => {
          const skipped = slot.skippedCount || 0;
          const used = slot.smokedCount + slot.sacrificedCount + skipped;
          const remaining = slot.allowance - used;
          const isCompleted = remaining === 0 && slot.smokedCount > 0 && slot.sacrificedCount === 0 && skipped === 0;
          const isFullySacrificed = remaining === 0 && slot.sacrificedCount === slot.allowance;
          const isFullySkipped = remaining === 0 && skipped === slot.allowance;
          const isMixedDone = remaining === 0 && !isCompleted && !isFullySacrificed && !isFullySkipped;
          const nowMinutes = timeToMinutes(nowTime) + (new Date().getHours() < 4 ? 1440 : 0);
          const slotMinutes = timeToMinutes(slot.time) + (slot.time < '04:00' ? 1440 : 0);
          const isAvailableNow = slotMinutes <= nowMinutes && remaining > 0;

          let cardStyle = 'bg-ios-card border-ios-border';
          let badgeHtml = '';
          let actionHtml = '';

          if (isCompleted) {
            cardStyle = 'bg-ios-card/60 border-amber-500/30';
            badgeHtml = renderScheduledSmokeChips(slot, todayKey);
            actionHtml = `
              <button onclick="undoSlotAction('${slot.slotId}')" class="px-3 py-2 rounded-xl bg-ios-elevated border border-ios-border text-zinc-400 text-xs font-medium active:scale-95 transition">
                Undo
              </button>
            `;
          } else if (isFullySacrificed) {
            cardStyle = 'bg-ios-card/50 border-rose-500/25';
            badgeHtml = `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-400">⇄ Forfeited Early</span>`;
            actionHtml = `
              <span class="text-[11px] text-zinc-500 italic pr-1">Used earlier</span>
            `;
          } else if (isFullySkipped) {
            cardStyle = 'bg-ios-card/60 border-emerald-500/25';
            const skipTime = slot.events.filter(e => e.type === 'skipped').pop()?.timestamp || '';
            badgeHtml = `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400">✓ Skipped ${skipTime ? 'at ' + skipTime : ''}</span>`;
            actionHtml = `
              <button onclick="undoSlotAction('${slot.slotId}')" class="px-3 py-2 rounded-xl bg-ios-elevated border border-ios-border text-zinc-400 text-xs font-medium active:scale-95 transition">
                Undo
              </button>
            `;
          } else if (isMixedDone) {
            cardStyle = 'bg-ios-card/60 border-zinc-700';
            const parts = [];
            if (skipped) parts.push(`${skipped} Skipped`);
            if (slot.sacrificedCount) parts.push(`${slot.sacrificedCount} Forfeited`);
            badgeHtml = `${renderScheduledSmokeChips(slot, todayKey)}${parts.length ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-zinc-700/60 text-zinc-300">${parts.join(' · ')}</span>` : ''}`;
            actionHtml = `
              <button onclick="undoSlotAction('${slot.slotId}')" class="px-3 py-2 rounded-xl bg-ios-elevated border border-ios-border text-zinc-400 text-xs font-medium active:scale-95 transition">
                Undo
              </button>
            `;
          } else {
            // Has remaining allowance
            if (isAvailableNow) {
              cardStyle = 'bg-ios-card border-amber-500/40 shadow-md shadow-amber-500/5';
              badgeHtml = `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400">● Window Open</span>`;
            } else {
              badgeHtml = `<span class="inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400">Upcoming</span>`;
            }
            if (slot.smokedCount > 0) badgeHtml = `${renderScheduledSmokeChips(slot, todayKey)}${badgeHtml}`;

            const countSub = slot.allowance > 1 ? `<span class="text-[11px] text-zinc-400 ml-1">(${remaining}/${slot.allowance} left)</span>` : '';

            actionHtml = `
              <div class="flex flex-wrap items-center justify-end gap-1.5">
                ${(slot.smokedCount + skipped) > 0 ? `<button onclick="undoSlotAction('${slot.slotId}')" class="p-2 rounded-xl bg-ios-elevated border border-ios-border text-zinc-400 text-xs active:scale-95">↩</button>` : ''}
                <button onclick="markSlotSkipped('${slot.slotId}')" class="px-3 py-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-semibold text-xs active:scale-95 transition">
                  Skipped
                </button>
                <button onclick="markSlotSmoked('${slot.slotId}')" class="px-3.5 py-2.5 rounded-xl ${isAvailableNow ? 'bg-amber-500 text-zinc-950 font-bold shadow-sm shadow-amber-500/20' : 'bg-ios-elevated border border-ios-border text-zinc-200 font-semibold'} text-xs active:scale-95 transition">
                  Mark Smoked
                </button>
              </div>
            `;
            if (skipped > 0) {
              badgeHtml += `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400">${skipped} Skipped</span>`;
            }
            badgeHtml += countSub;
          }

          return `
            <div class="${cardStyle} border rounded-2xl p-3.5 flex items-center justify-between gap-3 transition">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-sm font-bold text-white tabular-nums">${slot.time}</span>
                  <span class="text-sm font-medium text-zinc-300 truncate">${escapeHtml(slot.label)}</span>
                </div>
                <div class="flex flex-wrap items-center gap-1.5">
                  ${badgeHtml}
                </div>
              </div>
              <div class="shrink-0">
                ${actionHtml}
              </div>
            </div>
          `;
        }).join('');
      }

      // Build Extra / Swapped / Unexpected Activity Log HTML
      let extraLogsHtml = '';
      if (log.extraLogs && log.extraLogs.length > 0) {
        extraLogsHtml = `
          <div class="mt-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2.5 px-1">Unscheduled & Unexpected Log</h3>
            <div class="space-y-2">
              ${log.extraLogs.map(item => {
                const isSwap = item.type === 'swapped';
                return `
                  <div class="bg-ios-card border border-ios-border rounded-2xl p-3 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <div class="w-8 h-8 rounded-xl ${isSwap ? 'bg-sky-500/15 text-sky-400' : 'bg-purple-500/15 text-purple-400'} flex items-center justify-center shrink-0 text-xs font-bold">
                        ${isSwap ? '⇄' : '+1'}
                      </div>
                      <div class="min-w-0">
                        <button type="button" onclick="openSmokeTimeEditor('${todayKey}', 'extra', '', '${item.id}')" class="text-left text-xs font-semibold ${isSwap ? 'text-sky-300' : 'text-purple-300'} truncate underline decoration-dotted">
                          ${isSwap ? `Smoked Early (${item.timestamp})` : `Unexpected Event (${item.timestamp})`} · Edit time
                        </button>
                        <p class="text-[11px] text-zinc-400 truncate">
                          ${isSwap ? `Traded away: ${escapeHtml(item.sacrificedSlotLabel)}${item.fromSkipped ? ' (skipped)' : ''}` : escapeHtml(item.reason || 'Unplanned circumstance')}
                        </p>
                      </div>
                    </div>
                    <button onclick="undoExtraLog('${item.id}')" class="px-2.5 py-1.5 rounded-lg bg-ios-elevated border border-ios-border text-[11px] font-medium text-zinc-400 hover:text-white active:scale-95 transition shrink-0">
                      Undo
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return `
        <!-- Hero Quota Progress Card -->
        <div class="bg-ios-card border border-ios-border rounded-3xl p-5 mb-4 shadow-xl">
          <div class="flex items-center justify-between gap-4">
            <!-- SVG Progress Ring -->
            <div class="relative w-32 h-32 shrink-0 flex items-center justify-center">
              <svg class="w-32 h-32 -rotate-90" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="${radius}" stroke="#27272f" stroke-width="10" fill="none" />
                ${skippedLen > 0.5 ? `<circle cx="60" cy="60" r="${radius}" stroke="#10b981" stroke-width="10" fill="none"
                  stroke-linecap="round"
                  stroke-dasharray="${skippedLen} ${circumference}"
                  stroke-dashoffset="${-smokedLen}" />` : ''}
                ${smokedLen > 0.5 ? `<circle cx="60" cy="60" r="${radius}" stroke="${ringColor}" stroke-width="10" fill="none"
                  stroke-linecap="round"
                  stroke-dasharray="${smokedLen} ${circumference}"
                  stroke-dashoffset="0" />` : ''}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span class="text-2xl font-extrabold text-white tracking-tight leading-none">
                  ${m.totalSmoked}<span class="text-zinc-500 text-base font-semibold">/${m.planned}</span>
                </span>
                <span class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400 mt-1">Smoked</span>
              </div>
            </div>

            <!-- Breakdown Pills -->
            <div class="flex-1 space-y-2">
              <div class="flex items-center justify-between bg-ios-elevated/80 px-3 py-2 rounded-xl border border-ios-border/60">
                <span class="text-xs text-zinc-400">Planned Quota</span>
                <span class="text-xs font-bold text-white">${m.planned}</span>
              </div>
              <div class="flex items-center justify-between bg-ios-elevated/80 px-3 py-2 rounded-xl border border-ios-border/60">
                <span class="text-xs text-zinc-400">Swapped Early</span>
                <span class="text-xs font-bold text-sky-400">${m.swapped}</span>
              </div>
              <div class="flex items-center justify-between bg-ios-elevated/80 px-3 py-2 rounded-xl border border-ios-border/60">
                <span class="text-xs text-zinc-400">Unexpected</span>
                <span class="text-xs font-bold text-purple-400">+${m.unexpected}</span>
              </div>
              <div class="flex items-center justify-between bg-ios-elevated/80 px-3 py-2 rounded-xl border border-ios-border/60">
                <span class="text-xs text-zinc-400">Skipped</span>
                <span class="text-xs font-bold text-emerald-400">${m.skipped}</span>
              </div>
            </div>
          </div>

          <!-- Time since last cigarette (live stopwatch) -->
          <div class="mt-4 flex items-center justify-between gap-3 bg-ios-elevated/80 px-3.5 py-2.5 rounded-2xl border border-ios-border/60">
            <div class="flex items-center gap-2.5 min-w-0">
              <svg class="w-4 h-4 text-sky-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 14.5 14.5"/><line x1="9" y1="2" x2="15" y2="2"/>
              </svg>
              <div class="min-w-0">
                <p class="text-xs font-semibold text-zinc-300 leading-none">Since last cigarette</p>
                <p class="text-[10px] text-zinc-500 mt-1 truncate">${lastTs ? 'Last smoked at ' + lastLabel : 'No cigarettes logged yet'}</p>
              </div>
            </div>
            <span id="since-last" data-ts="${lastTs || ''}" class="text-lg font-extrabold text-white tabular-nums shrink-0">${lastTs ? formatStopwatch(Date.now() - lastTs) : '--:--:--'}</span>
          </div>

          <!-- Primary Action Buttons: Smoke Now (Trade) & +1 Unexpected -->
          <div class="grid grid-cols-2 gap-2.5 mt-5 pt-4 border-t border-ios-border/80">
            <button onclick="openSmokeNowModal()" class="flex items-center justify-center gap-2 py-3 px-3 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 text-zinc-950 font-bold text-xs shadow-lg shadow-amber-500/20 active:scale-[0.98] transition">
              <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
              <span>Smoke Now (Trade)</span>
            </button>

            <button onclick="openUnexpectedModal()" class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-2xl bg-ios-elevated border border-ios-border text-zinc-200 font-semibold text-xs hover:border-purple-500/50 active:scale-[0.98] transition">
              <svg class="w-4 h-4 text-purple-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
              </svg>
              <span>+1 Unexpected</span>
            </button>
          </div>
        </div>

        <!-- Scheduled Slots List -->
        <div class="flex items-center justify-between mb-2.5 px-1">
          <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-500">Today's Schedule (${DAYS[log.dayOfWeek]})</h2>
          <span class="text-[11px] text-zinc-500">${m.planned - log.slots.reduce((acc, s) => acc + s.smokedCount + s.sacrificedCount + (s.skippedCount || 0), 0)} slots remaining</span>
        </div>

        <div class="space-y-2.5">
          ${slotsHtml}
        </div>

        ${extraLogsHtml}
      `;
    }

    function renderScheduledSmokeChips(slot, dateKey) {
      const events = (slot.events || []).map((ev, index) => ({ ev, index })).filter(x => x.ev.type === 'scheduled');
      if (!events.length) return '<span class="text-[11px] text-amber-400">✓ Smoked</span>';
      return events.map(({ev, index}, n) => {
        const ts = eventTs(dateKey, ev);
        const time = ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false}) : (ev.timestamp || '');
        return `<button type="button" onclick="openSmokeTimeEditor('${dateKey}', 'slot', '${slot.slotId}', '', ${index})" class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-1 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/20 active:scale-95" title="Edit smoking time">✓ ${time || `Cigarette ${n+1}`} · Edit</button>`;
      }).join('');
    }

    function openSmokeTimeEditor(dateKey, source, slotId, extraId, eventIndex) {
      const log = state.logs[dateKey];
      if (!log) return;
      let ev = null;
      if (source === 'slot') {
        const slot = (log.slots || []).find(s => s.slotId === slotId);
        ev = slot && slot.events ? slot.events[eventIndex] : null;
      } else {
        ev = (log.extraLogs || []).find(e => e.id === extraId);
      }
      if (!ev || (source === 'slot' && ev.type !== 'scheduled') || (source === 'extra' && !['swapped','unexpected'].includes(ev.type))) return;
      const ts = eventTs(dateKey, ev) || Date.now();
      const timeValue = new Date(ts).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', hour12:false});
      openModal(`
        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold text-white">Edit smoking time</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-ios-elevated text-zinc-400">✕</button>
          </div>
          <p class="text-xs text-zinc-400 mb-4">Change when this cigarette was actually smoked. It will update the average gap and the daily timeline.</p>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Actual smoking time</label>
          <input id="edit-smoke-time" type="time" value="${timeValue}" class="modal-time-input w-full min-w-0 max-w-full px-3.5 py-3 rounded-2xl bg-ios-elevated border border-ios-border text-white text-lg mb-5" />
          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="closeModal()" class="py-3 rounded-2xl bg-ios-elevated text-zinc-400 font-semibold text-xs">Cancel</button>
            <button onclick="saveSmokeTimeEdit('${dateKey}','${source}','${slotId || ''}','${extraId || ''}',${eventIndex === undefined ? -1 : eventIndex})" class="py-3 rounded-2xl bg-amber-500 text-zinc-950 font-bold text-xs">Save time</button>
          </div>
        </div>
      `);
    }

    function saveSmokeTimeEdit(dateKey, source, slotId, extraId, eventIndex) {
      const value = document.getElementById('edit-smoke-time')?.value;
      if (!value || !/^([01]\d|2[0-3]):[0-5]\d$/.test(value)) { showToast('Choose a valid time', '!'); return; }
      const log = state.logs[dateKey];
      if (!log) return;
      let ev = null;
      if (source === 'slot') {
        const slot = (log.slots || []).find(s => s.slotId === slotId);
        ev = slot && slot.events ? slot.events[eventIndex] : null;
      } else ev = (log.extraLogs || []).find(e => e.id === extraId);
      if (!ev) return;
      const [y,m,d] = dateKey.split('-').map(Number);
      const [hh,mm] = value.split(':').map(Number);
      const eventDate = new Date(y,m-1,d);
      if (hh < 4) eventDate.setDate(eventDate.getDate()+1);
      eventDate.setHours(hh,mm,0,0);
      ev.timestamp = value;
      ev.ts = eventDate.getTime();
      saveState(); closeModal(); render(); showToast('Smoking time updated', '✓');
    }

    function markSlotSmoked(slotId) {
      const todayKey = getTodayKey();
      const log = state.logs[todayKey];
      const slot = log.slots.find(s => s.slotId === slotId);
      if (!slot) return;

      const remaining = slot.allowance - (slot.smokedCount + slot.sacrificedCount);
      if (remaining <= 0) return;

      slot.smokedCount += 1;
      slot.events.push({ type: 'scheduled', timestamp: getCurrentTimeStr(), ts: Date.now() });
      saveState();
      render();
      showToast(`Logged: ${slot.label}`);
    }

    function markSlotSkipped(slotId) {
      const todayKey = getTodayKey();
      const log = state.logs[todayKey];
      const slot = log.slots.find(s => s.slotId === slotId);
      if (!slot) return;

      const remaining = slot.allowance - (slot.smokedCount + slot.sacrificedCount + (slot.skippedCount || 0));
      if (remaining <= 0) return;

      slot.skippedCount = (slot.skippedCount || 0) + 1;
      slot.events.push({ type: 'skipped', timestamp: getCurrentTimeStr() });
      saveState();
      render();
      showToast(`Skipped: ${slot.label}`);
    }

    function undoSlotAction(slotId) {
      const todayKey = getTodayKey();
      const log = state.logs[todayKey];
      const slot = log.slots.find(s => s.slotId === slotId);
      if (!slot) return;

      // Undo the most recent smoked / skipped action on this slot
      let idx = -1;
      for (let i = slot.events.length - 1; i >= 0; i--) {
        if (slot.events[i].type === 'scheduled' || slot.events[i].type === 'skipped') {
          idx = i;
          break;
        }
      }

      if (idx === -1) {
        if (slot.smokedCount <= 0) return;
        slot.smokedCount -= 1;
        saveState();
        render();
        showToast('Reverted scheduled smoke', '↩');
        return;
      }

      const type = slot.events[idx].type;
      slot.events.splice(idx, 1);
      if (type === 'skipped') {
        slot.skippedCount = Math.max(0, (slot.skippedCount || 0) - 1);
      } else {
        slot.smokedCount = Math.max(0, slot.smokedCount - 1);
      }
      saveState();
      render();
      showToast(type === 'skipped' ? 'Skip reverted' : 'Reverted scheduled smoke', '↩');
    }

    /**
     * MODAL: Smoke Now (Unscheduled) -> Must choose a remaining slot to sacrifice
     */
    function openSmokeNowModal() {
      const todayKey = getTodayKey();
      const log = state.logs[todayKey];
      // Trade options: skipped cigarettes first, then cigarettes still available
      const tradeOptions = [];
      log.slots.forEach(s => {
        const sk = s.skippedCount || 0;
        if (sk > 0) tradeOptions.push({ slot: s, source: 'skipped', count: sk });
      });
      log.slots.forEach(s => {
        const rem = s.allowance - (s.smokedCount + s.sacrificedCount + (s.skippedCount || 0));
        if (rem > 0) tradeOptions.push({ slot: s, source: 'available', count: rem });
      });

      if (tradeOptions.length === 0) {
        openModal(`
          <div class="text-center py-2">
            <div class="w-12 h-12 rounded-2xl bg-rose-500/15 text-rose-400 flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <h3 class="text-lg font-bold text-white mb-1.5">No Slots Left to Trade</h3>
            <p class="text-xs text-zinc-400 leading-relaxed mb-5">
              You have already used or forfeited all scheduled cigarettes for today. To stay disciplined, only smoke now if there's an unexpected event.
            </p>
            <div class="space-y-2.5">
              <button onclick="closeModal(); openUnexpectedModal();" class="w-full py-3 rounded-2xl bg-purple-600 text-white font-bold text-sm active:scale-98 transition">
                Log as +1 Unexpected Event
              </button>
              <button onclick="closeModal()" class="w-full py-3 rounded-2xl bg-ios-elevated text-zinc-300 font-semibold text-sm">
                Cancel (Hold Strong)
              </button>
            </div>
          </div>
        `);
        return;
      }

      const optionsHtml = tradeOptions.map(o => {
        const s = o.slot;
        const isSkipped = o.source === 'skipped';
        return `
          <button onclick="confirmSwapSlot('${s.slotId}', '${o.source}')" class="w-full text-left p-3.5 rounded-2xl bg-ios-elevated border ${isSkipped ? 'border-emerald-500/30 hover:border-emerald-500/70' : 'border-ios-border hover:border-amber-500/60'} active:scale-[0.98] transition flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">

    function confirmSwapSlot(slotId, source = 'available') {
      const todayKey = getTodayKey();
      const log = state.logs[todayKey];
      const slot = log.slots.find(s => s.slotId === slotId);
      if (!slot) return;

      const fromSkipped = source === 'skipped';
      let skippedAt = null;

      if (fromSkipped) {
        // Use a cigarette that was skipped earlier: skipped -> forfeited
        if ((slot.skippedCount || 0) <= 0) return;
        slot.skippedCount -= 1;
        for (let i = slot.events.length - 1; i >= 0; i--) {
          if (slot.events[i].type === 'skipped') {
            skippedAt = slot.events[i].timestamp;
            slot.events.splice(i, 1);
            break;
          }
        }
      } else {
        const rem = slot.allowance - (slot.smokedCount + slot.sacrificedCount + (slot.skippedCount || 0));
        if (rem <= 0) return;
      }

      slot.sacrificedCount += 1;
      const nowStr = getCurrentTimeStr();
      slot.events.push({ type: 'sacrificed', timestamp: nowStr });

      log.extraLogs.unshift({
        id: uid(),
        type: 'swapped',
        timestamp: nowStr,
        ts: Date.now(),
        sacrificedSlotId: slot.slotId,
        sacrificedSlotLabel: `${slot.time} — ${slot.label}`,
        fromSkipped,
        skippedAt
      });

      saveState();
      closeModal();
      render();
      showToast(`Traded ${slot.time} (${slot.label})`, '⇄');
    }

    function undoExtraLog(extraId) {
      const todayKey = getTodayKey();
      const log = state.logs[todayKey];
      const idx = log.extraLogs.findIndex(e => e.id === extraId);
      if (idx === -1) return;

      const item = log.extraLogs[idx];
      if (item.type === 'swapped' && item.sacrificedSlotId) {
        const slot = log.slots.find(s => s.slotId === item.sacrificedSlotId);
        if (slot && slot.sacrificedCount > 0) {
          slot.sacrificedCount -= 1;
          for (let i = slot.events.length - 1; i >= 0; i--) {
            if (slot.events[i].type === 'sacrificed') {
              slot.events.splice(i, 1);
              break;
            }
          }
          if (item.fromSkipped) {
            // Give the cigarette back as "skipped" instead of "available"
            slot.skippedCount = (slot.skippedCount || 0) + 1;
            slot.events.push({ type: 'skipped', timestamp: item.skippedAt || getCurrentTimeStr() });
          }
        }
      }

      log.extraLogs.splice(idx, 1);
      saveState();
      render();
      showToast('Entry removed & slot restored', '↩');

    /*************************************************************************
     * 7. STATS & 7-DAY HISTORY VIEW
     *************************************************************************/
    function renderStatsView() {
      ensureTodayLog();

      // Gather last 7 days
      const last7 = [];
      let totalSmoked7d = 0;
      let totalPlanned7d = 0;
      let totalSwaps7d = 0;
      let totalUnexpected7d = 0;

      for (let i = 6; i >= 0; i--) {
        const key = getTodayKey(-i);
        const [y, m, d] = key.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        const dow = dateObj.getDay();

        let log = state.logs[key];
        let metrics;
        if (log) {
          metrics = getDayMetrics(log);
        } else {
          const planned = (state.schedule[dow] || []).reduce((sum, s) => sum + (s.count || 1), 0);
          metrics = { planned, totalSmoked: 0, swapped: 0, unexpected: 0 };
        }

        totalSmoked7d += metrics.totalSmoked;
        totalPlanned7d += metrics.planned;
        totalSwaps7d += metrics.swapped;
        totalUnexpected7d += metrics.unexpected;

        last7.push({
          key,
          shortDay: SHORT_DAYS[dow],
          dateLabel: dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
          isToday: i === 0,
          hasLog: Boolean(log),
          ...metrics
        });
      }

      // Average from the first app-use day through yesterday (today is intentionally excluded).
      const yesterdayKey = getTodayKey(-1);
      const startKey = state.startedAt || yesterdayKey;
      const startDate = new Date(...startKey.split('-').map((v, i) => i === 1 ? Number(v) - 1 : Number(v)));
      const yesterdayDate = new Date(...yesterdayKey.split('-').map((v, i) => i === 1 ? Number(v) - 1 : Number(v)));
      const completedDays = Math.max(0, Math.floor((Date.UTC(yesterdayDate.getFullYear(), yesterdayDate.getMonth(), yesterdayDate.getDate()) - Date.UTC(startDate.getFullYear(), startDate.getMonth(), startDate.getDate())) / 86400000) + 1);
      let completedTotal = 0;
      if (completedDays > 0) {
        for (let i = 0; i < completedDays; i++) {
          const key = getDateKeyFromOffset(startKey, i);
          if (state.logs[key]) completedTotal += getDayMetrics(state.logs[key]).totalSmoked;
        }
      }
      const average = completedDays > 0 ? completedTotal / completedDays : null;
      const averageLabel = average === null ? '—' : (Number.isInteger(average) ? String(average) : `${Math.floor(average)}–${Math.ceil(average)}`);

      const maxVal = Math.max(6, ...last7.map(d => Math.max(d.totalSmoked, d.planned)));

      const barsHtml = last7.map(d => {
        const smokedHeightPct = Math.round((d.totalSmoked / maxVal) * 100);
        const plannedHeightPct = Math.round((d.planned / maxVal) * 100);
        const overQuota = d.totalSmoked > d.planned;

        return `
          <div class="flex flex-col items-center flex-1">
            <span class="text-[11px] font-bold ${d.isToday ? 'text-amber-400' : 'text-zinc-300'} mb-1.5 tabular-nums">
              ${d.totalSmoked}
            </span>
            <div class="w-full max-w-[28px] h-32 bg-ios-elevated/70 rounded-xl relative flex items-end overflow-hidden border border-ios-border/60">
              <!-- Planned quota marker line -->
              <div style="bottom: ${plannedHeightPct}%" class="absolute inset-x-0 border-t border-dashed border-zinc-500/70 z-10"></div>
              <!-- Smoked bar -->
              <div style="height: ${smokedHeightPct}%"
                class="w-full rounded-t-lg transition-all duration-500 ${
                  overQuota ? 'bg-rose-500' : (d.isToday ? 'bg-amber-500' : 'bg-emerald-500/85')
                }">
              </div>
            </div>
            <span class="text-[11px] font-semibold mt-2 ${d.isToday ? 'text-amber-400' : 'text-zinc-400'}">${d.shortDay}</span>
          </div>
        `;
      }).join('');

      // Past logged days list
      const allLoggedKeys = Object.keys(state.logs).sort((a, b) => b.localeCompare(a));
      const historyCards = allLoggedKeys.map(key => {
        const log = state.logs[key];
        const m = getDayMetrics(log);
        const limit = m.planned;
        const onTrack = m.totalSmoked <= limit;
        const avgGap = getAvgGapMs(getSmokeTimes(log, key));

        return `
          <button type="button" onclick="openDailyLogDetails('${key}')" class="w-full text-left bg-ios-card border border-ios-border rounded-2xl p-3.5 flex items-center justify-between active:scale-[0.99] transition">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <p class="text-sm font-bold text-white">${formatDisplayDate(key)}</p>
                ${key === getTodayKey() ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400">Today</span>' : ''}
              </div>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 mt-1 text-[11px] text-zinc-400">
                <span>Quota: <strong class="text-zinc-200">${m.planned}</strong></span>
                <span>Swaps: <strong class="text-sky-400">${m.swapped}</strong></span>
                ${m.skipped ? `<span>Skipped: <strong class="text-emerald-400">${m.skipped}</strong></span>` : ''}
                <span>Avg gap: <strong class="text-amber-400">${avgGap === null ? '—' : formatGap(avgGap)}</strong></span>
                <span>Unexpected: <strong class="text-purple-400">+${m.unexpected}</strong></span>
              </div>
            </div>

            <div class="text-right">
              <span class="text-base font-extrabold ${onTrack ? 'text-emerald-400' : 'text-rose-400'} tabular-nums">
                ${m.totalSmoked} <span class="text-xs font-medium text-zinc-500">/ ${limit}</span>
              </span>
              <p class="text-[10px] font-semibold ${onTrack ? 'text-emerald-500/80' : 'text-rose-400'}">
                ${onTrack ? 'Within Limit' : 'Over Limit'}
              </p>
            </div>
            <span class="text-zinc-500 text-xs ml-2" aria-hidden="true">›</span>
          </button>
        `;
      }).join('');

      return `
        <!-- Summary Metrics -->
        <div class="grid grid-cols-3 gap-2.5 mb-4">
          <div class="bg-ios-card border border-ios-border rounded-2xl p-3.5">
            <p class="text-[11px] text-zinc-400 font-medium">7-Day Total</p>
            <p class="text-xl font-extrabold text-white mt-0.5 tabular-nums">${totalSmoked7d}</p>
            <p class="text-[10px] text-zinc-500 mt-0.5">vs ${totalPlanned7d} planned</p>
          </div>
          <div class="bg-ios-card border border-ios-border rounded-2xl p-3.5">
            <p class="text-[11px] text-zinc-400 font-medium">Average Cigarettes / Day</p>
            <p class="text-xl font-extrabold text-sky-400 mt-0.5 tabular-nums">${averageLabel}</p>
            <p class="text-[10px] text-zinc-500 mt-0.5">Since start, through yesterday</p>
          </div>
          <div class="bg-ios-card border border-ios-border rounded-2xl p-3.5">
            <p class="text-[11px] text-zinc-400 font-medium">Unexpected</p>
            <p class="text-xl font-extrabold text-purple-400 mt-0.5 tabular-nums">+${totalUnexpected7d}</p>
            <p class="text-[10px] text-zinc-500 mt-0.5">Extra events</p>
          </div>
        </div>

        <!-- 7-Day Bar Chart -->
        <div class="bg-ios-card border border-ios-border rounded-3xl p-4 mb-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-400">Last 7 Days</h3>
            <div class="flex items-center gap-3 text-[10px] text-zinc-400">
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Within Quota</span>
              <span class="flex items-center gap-1"><span class="w-2.5 border-t border-dashed border-zinc-400"></span> Quota</span>
            </div>
          </div>
          <div class="flex items-end justify-between gap-2 pt-2">
            ${barsHtml}
          </div>
        </div>

        <!-- Daily History Log -->
        <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2.5 px-1">Daily Logs</h3>
        <div class="space-y-2.5">
          ${historyCards}
        </div>
      `;
    }

    function openDailyLogDetails(dateKey) {
      const log = state.logs[dateKey];
      if (!log) return;
      const entries = [];

      (log.slots || []).forEach(slot => {
        (slot.events || []).forEach(ev => {
          if (ev.type !== 'scheduled') return;
          const ts = eventTs(dateKey, ev);
          if (!ts) return;
          entries.push({
            ts,
            type: 'scheduled',
            label: slot.label || 'Scheduled cigarette',
            reason: ev.note || ev.reason || `Scheduled slot: ${slot.time || ''} ${slot.label || ''}`.trim()
          });
        });
      });

      (log.extraLogs || []).forEach(ev => {
        if (ev.type !== 'swapped' && ev.type !== 'unexpected') return;
        const ts = eventTs(dateKey, ev);
        if (!ts) return;
        if (ev.type === 'unexpected') {
          entries.push({ ts, type: 'unexpected', label: 'Unexpected cigarette', reason: ev.reason || 'Unexpected schedule break' });
        } else {
          entries.push({ ts, type: 'traded', label: 'Traded cigarette', reason: ev.sacrificedSlotLabel ? `Traded for ${ev.sacrificedSlotLabel}` : 'Traded for a scheduled slot' });
        }
      });

      entries.sort((a, b) => a.ts - b.ts);
      const styles = {
        scheduled: { title: 'Scheduled', color: 'text-emerald-400', dot: 'bg-emerald-400', border: 'border-emerald-500/30' },
        unexpected: { title: 'Unexpected', color: 'text-purple-400', dot: 'bg-purple-400', border: 'border-purple-500/30' },
        traded: { title: 'Traded', color: 'text-sky-400', dot: 'bg-sky-400', border: 'border-sky-500/30' }
      };
      const entriesHtml = entries.length ? entries.map((entry, index) => {
        const style = styles[entry.type];
        const time = new Date(entry.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        return `
          <div class="rounded-2xl border ${style.border} bg-ios-elevated/70 p-3.5 flex gap-3">
            <div class="flex flex-col items-center pt-1"><span class="w-2.5 h-2.5 rounded-full ${style.dot}"></span><span class="text-[10px] text-zinc-600 mt-1">${index + 1}</span></div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-3">
                <span class="text-sm font-bold ${style.color}">${style.title}</span>
                <span class="text-sm font-bold text-white tabular-nums">${time}</span>
              </div>
              <p class="text-xs text-zinc-200 mt-1">${escapeHtml(entry.label)}</p>
              <p class="text-[11px] text-zinc-400 mt-1">Reason: ${escapeHtml(entry.reason)}</p>
            </div>
          </div>`;
      }).join('') : '<p class="text-sm text-zinc-400 text-center py-8">No cigarettes were logged for this day.</p>';

      openModal(`
        <div>
          <div class="flex items-center justify-between mb-1">
            <h3 class="text-lg font-bold text-white">${formatDisplayDate(dateKey)}</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-ios-elevated text-zinc-400 flex items-center justify-center text-sm">✕</button>
          </div>
          <p class="text-[11px] text-zinc-500 mb-4">Daily detail · 04:00 – 03:59 next day</p>
          <div class="flex flex-wrap gap-3 text-[10px] mb-4">
            <span class="text-emerald-400">● Scheduled</span><span class="text-purple-400">● Unexpected</span><span class="text-sky-400">● Traded</span>
          </div>
          <div class="space-y-2.5 max-h-[60vh] overflow-y-auto pr-1">${entriesHtml}</div>
        </div>
      `);
    }

    /*************************************************************************
     * 8. DATA BACKUP / RESTORE
     *************************************************************************/
    function openDataToolsModal() {
      openModal(`
        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold text-white">Data Backup</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-ios-elevated text-zinc-400 flex items-center justify-center text-sm">✕</button>
          </div>
          <p class="text-xs text-zinc-400 leading-relaxed mb-5">
            Export your complete Smoky data as a JSON file, then import that file on another device to restore your schedules and history.
          </p>
          <div class="space-y-2.5">
            <button onclick="exportDataBackup()" class="w-full flex items-center justify-center gap-2 py-3 rounded-2xl bg-amber-500 text-zinc-950 font-bold text-sm active:scale-98 transition">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 17v4h14v-4"/></svg>
              Export JSON
            </button>
            <button onclick="document.getElementById('backup-import-input').click()" class="w-full flex items-center justify-center gap-2 py-3 rounded-2xl bg-ios-elevated border border-ios-border text-zinc-100 font-semibold text-sm active:scale-98 transition">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m17 14-5-5-5 5"/><path d="M5 7V3h14v4"/></svg>
              Import JSON
            </button>
            <input id="backup-import-input" type="file" accept=".json,application/json" class="hidden" onchange="importDataBackup(event)" />
          </div>
          <p class="text-[10px] text-zinc-500 mt-4 text-center">Import replaces the data currently saved on this device.</p>
        </div>
      `);
    }

    function exportDataBackup() {
      const backup = {
        app: 'Smoky',
        schemaVersion: 3,
        exportedAt: new Date().toISOString(),
        startedAt: state.startedAt || getTodayKey(),
        schedule: state.schedule,
        scheduleOverrides: state.scheduleOverrides,
        logs: state.logs
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `smoky-backup-${getTodayKey()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast('Backup exported', '↓');
    }

    async function importDataBackup(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!parsed || parsed.app !== 'Smoky' || !parsed.schedule || typeof parsed.schedule !== 'object' ||
            !parsed.logs || typeof parsed.logs !== 'object') {
          throw new Error('This is not a valid Smoky backup.');
        }
        const validSchedule = Object.keys(parsed.schedule).every(day =>
          /^[0-6]$/.test(day) && Array.isArray(parsed.schedule[day]) &&
          parsed.schedule[day].every(slot => slot && typeof slot.id === 'string' &&
            typeof slot.time === 'string' && typeof slot.label === 'string')
        );
        if (!validSchedule) throw new Error('The backup schedule is invalid.');
        if (!confirm('Import this backup? It will replace all Smoky data currently saved on this device.')) {
          event.target.value = '';
          return;
        }
        state.schedule = parsed.schedule;
        state.scheduleOverrides = parsed.scheduleOverrides || {};
        state.logs = parsed.logs;
        state.startedAt = parsed.startedAt || Object.keys(parsed.logs).sort()[0] || getTodayKey();
        ensureTodayLog();
        saveState();
        closeModal();
        render();
        showToast('Backup imported successfully', '↑');
      } catch (error) {
        showToast(error.message || 'Could not import this backup', '!');
      } finally {
        event.target.value = '';
      }
    }

    /*************************************************************************
     * 8. iOS HOME SCREEN GUIDE MODAL & UTILS
     *************************************************************************/
    function openInstallModal() {
      openModal(`
        <div>
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-zinc-950 font-bold">
                
              </div>
              <h3 class="text-base font-bold text-white">Add to iPhone Home Screen</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-ios-elevated text-zinc-400 flex items-center justify-center text-sm">✕</button>
          </div>

          <p class="text-xs text-zinc-400 leading-relaxed mb-4">
            Install <strong class="text-white">Smoky</strong> as a full-screen iOS app. All your schedules and daily logs stay saved directly on your device.
          </p>

          <div class="space-y-2.5 text-xs text-zinc-200 mb-5">
            <div class="p-3 rounded-2xl bg-ios-elevated border border-ios-border flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0">1</span>
              <span>Open this page in <strong>Safari</strong> on your iPhone.</span>
            </div>
            <div class="p-3 rounded-2xl bg-ios-elevated border border-ios-border flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0">2</span>
              <span>Tap the <strong>Share</strong> icon <span class="inline-block px-1.5 py-0.5 rounded bg-zinc-700 text-sky-400 font-bold">↑</span> at the bottom of the screen.</span>
            </div>
            <div class="p-3 rounded-2xl bg-ios-elevated border border-ios-border flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0">3</span>
              <span>Scroll down and tap <strong>"Add to Home Screen"</strong>.</span>
            </div>
          </div>

          <button onclick="closeModal()" class="w-full py-3 rounded-2xl bg-amber-500 text-zinc-950 font-bold text-xs">
            Got It
          </button>
        </div>
      `);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[m]);
    }

    // Boot Application
    let lastLogicalDayKey = null;
    function refreshOnLogicalDayChange() {
      const currentKey = getTodayKey();
      if (lastLogicalDayKey !== currentKey) {
        lastLogicalDayKey = currentKey;
        ensureTodayLog();
        render();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      lastLogicalDayKey = getTodayKey();
      render();
      setInterval(tickStopwatch, 1000);
      // Refresh at the 04:00 logical-day boundary even if the app stays open.
      setInterval(refreshOnLogicalDayChange, 15000);
    });
  </script>
